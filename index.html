:root {
  --violet: #5A3DB8;
  --deep: #432C93;
  --lav: #A993E4;
  --gold: #F2C774;
  --ink: #221B35;
  --paper: #F7F5FB;
  --surface: #FFFFFF;
  --muted: #5A5370;
  --line: #DCD5EE;
  --field: #8A82A6;
  --lav-soft: #ECE7F9;
  --gold-soft: #FCF1D6;
  --danger: #A3262B;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px;
  --r1: 8px; --r2: 12px;
  --head: "Montserrat", "Schibsted Grotesk", sans-serif;
  --body: "Schibsted Grotesk", system-ui, sans-serif;
  --nav-h: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, p, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: var(--deep); text-underline-offset: 3px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
h1:focus { outline: none; }

.offscreen { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: var(--s4); top: -64px; z-index: 5; }
.skip:focus { top: var(--s2); }

/* ----- frame ----- */
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); padding: var(--s2) var(--s4) 0; padding-top: calc(var(--s2) + env(safe-area-inset-top)); }
.brand { font: 700 16px/1.2 var(--head); color: var(--violet); }
main {
  padding: var(--s4) var(--s4) calc(var(--nav-h) + var(--s12) + env(safe-area-inset-bottom));
  padding-left: calc(var(--s4) + env(safe-area-inset-left));
  padding-right: calc(var(--s4) + env(safe-area-inset-right));
  max-width: 1040px; margin: 0 auto;
}
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-list { display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 var(--s1); }
.nav-link {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s1);
  min-height: var(--nav-h); padding: var(--s2) 0;
  font-size: 14px; line-height: 1.2; font-weight: 500; color: var(--muted); text-decoration: none; text-align: center;
}
.nav-settings { flex-direction: row; gap: var(--s2); min-height: 48px; padding: var(--s2) 0 var(--s2) var(--s3); }
.nav-link.is-on { color: var(--violet); font-weight: 700; }
.ico { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ----- type ----- */
h1 { font: 700 28px/1.2 var(--head); letter-spacing: -0.01em; }
h2 { font: 600 18px/1.3 var(--head); }
h3 { margin: 0; font: 600 16px/1.3 var(--body); display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); }
h3 .meta { font-weight: 400; flex: none; }
h3 a { display: inline-block; padding: var(--s1) 0; }
.lede { margin-top: var(--s2); color: var(--muted); }
.meta { font-size: 14px; line-height: 1.4; color: var(--muted); }
.hint { margin-top: var(--s3); font-size: 14px; line-height: 1.4; color: var(--muted); }
.crumb { margin-bottom: var(--s3); }
.crumb a { display: inline-flex; align-items: center; gap: var(--s1); min-height: 44px; font-weight: 600; text-decoration: none; }
.empty { color: var(--muted); }

/* ----- surfaces ----- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); padding: var(--s4); }
.cols { margin-top: var(--s6); display: grid; gap: var(--s6); }
.col-main, .col-side { display: grid; gap: var(--s4); align-content: start; min-width: 0; }

/* ----- buttons: one system ----- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: 48px; padding: var(--s2) var(--s4);
  border: 1px solid transparent; border-radius: var(--r1);
  font: 600 16px/1.2 var(--body); text-align: center; text-decoration: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary { background: var(--violet); color: #fff; }
.btn-primary:active { background: var(--deep); }
.btn-secondary { background: var(--surface); border-color: var(--violet); color: var(--deep); }
.btn-secondary:active { background: var(--lav-soft); }

}

.step-title a { color: var(--ink); text-decoration: none; display: block; }
.step .meta { margin-top: var(--s1); }
.step-next { margin-top: var(--s3); }
.step.is-done .step-title a { color: var(--muted); }

.row > .done-mark { margin-top: 0; }
.finish .btn { width: 100%; margin-top: var(--s4); }

/* ----- notices ----- */
.notice { border-radius: var(--r2); padding: var(--s4); display: grid; gap: var(--s3); }
.notice-gold { background: var(--gold-soft); border: 1px solid var(--gold); }
.notice-warn { background: var(--surface); border: 1px solid var(--danger); }
.notice .stack, .notice .row { margin-top: 0; }
.recheck { margin-top: var(--s6); }
.recheck .row { margin-top: var(--s2); }
.notice > .btn { width: 100%; }

/* ----- dates ----- */
.datelist { display: grid; gap: var(--s3); margin-top: var(--s3); }
.datelist li { display: grid; gap: var(--s1); }
.date-d { font-weight: 600; font-size: 14px; line-height: 1.4; color: var(--deep); display: flex; justify-content: space-between; gap: var(--s3); }
.date-away { font-weight: 400; color: var(--muted); }
.date-l a { display: inline-block; padding: var(--s1) 0; }
.more { margin-top: var(--s3); }
.more a, .date-l a { min-height: 24px; }
.datelist.big { margin-top: var(--s6); gap: 0; padding: 0 var(--s4); }
.datelist.big li { padding: var(--s4) 0; border-top: 1px solid var(--line); }
.datelist.big li:first-child { border-top: 0; }
.datelist.big .date-l a { padding: var(--s2) 0; }

/* ----- areas ----- */
.arealist { margin-top: var(--s6); display: grid; gap: var(--s3); }
.arearow { display: flex; align-items: center; gap: var(--s3); color: var(--ink); text-decoration: none; min-height: 72px; }
.arearow-text { flex: 1; min-width: 0; display: grid; gap: var(--s1); }
.arearow-name { font: 600 16px/1.3 var(--head); }
.arearow .ico, .itemrow > .ico { color: var(--lav); }

.bar-fill { display: block; height: 100%; background: var(--violet); border-radius: var(--r1); }

.group { margin-top: var(--s8); }
.group > h2 { margin-bottom: var(--s3); }
.itemlist { padding: 0 var(--s2) 0 0; }
.itemlist.plain { padding-left: var(--s4); margin-top: var(--s4); }

.pro { margin-top: var(--s3); padding: var(--s3); border-radius: var(--r1); background: var(--lav-soft); font-size: 14px; line-height: 1.4; }

.seg-btn { min-height: 48px; padding: var(--s2); border: 1px solid var(--field); border-radius: var(--r1); background: var(--surface); font-weight: 600; line-height: 1.2; cursor: pointer; }
.seg-btn.is-on { background: var(--violet); border-color: var(--violet); color: #fff; }
.facts { display: grid; gap: var(--s3); }
.fact { display: grid; gap: var(--s1); }

.fact dd a { overflow-wrap: anywhere; display: inline-block; padding: var(--s1) 0; }
.conf { display: block; font-size: 14px; line-height: 1.4; color: var(--muted); }
.label { display: block; font-weight: 600; margin: var(--s4) 0 var(--s2); }
.block > h2 > .label { margin: 0; font: inherit; }
.field { display: block; width: 100%; min-height: 48px; padding: var(--s3); border: 1px solid var(--field); border-radius: var(--r1); background: var(--surface); font-size: 16px; line-height: 1.5; }
textarea.field { resize: vertical; }
select.field { color: var(--ink); }
.field-error { margin-top: var(--s3); font-weight: 600; color: var(--danger); }
.field-error:empty { display: none; }
.fulist { display: grid; gap: var(--s4); margin-top: var(--s3); }
.fulist li { display: grid; gap: var(--s1); padding-top: var(--s4); border-top: 1px solid var(--line); }
.fulist li:first-child { padding-top: 0; border-top: 0; }
.fu-name { font-weight: 600; display: inline-block; padding: var(--s1) 0; }
.fu-btn { width: 100%; margin-top: var(--s2); }
.lead-actions { margin-top: var(--s6); max-width: 640px; }
.cols-one { margin-top: var(--s6); max-width: 640px; }
.msg .label:first-of-type { margin-top: var(--s3); }
.msg .row, .msg .stack { margin-top: var(--s4); }
.msg textarea.field { font-size: 16px; line-height: 1.5; }
input[type="date"].field { -webkit-appearance: none; appearance: none; }

/* ----- wins ----- */
.winform { margin-top: var(--s6); max-width: 640px; }
.winform .label { margin-top: 0; }
.winform-row { display: flex; gap: var(--s2); }
.winform-row .field { flex: 1; min-width: 0; }
.winform-row .btn { flex: none; }
.winlist { margin-top: var(--s6); padding: 0 var(--s4); max-width: 640px; }
.winlist li { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--line); }
.winlist li:first-child { border-top: 0; }
.win-text { flex: 1; min-width: 0; display: grid; gap: var(--s1); }
.win-text a { display: inline-block; padding: var(--s1) 0; font-weight: 600; }
.win-text > span:first-child { font-weight: 600; }

/* ----- toast ----- */
#toast { position: fixed; left: var(--s4); right: var(--s4); bottom: calc(var(--nav-h) + var(--s3) + env(safe-area-inset-bottom)); z-index: 4; display: flex; justify-content: center; pointer-events: none; }
.toast-box { pointer-events: auto; display: flex; align-items: center; gap: var(--s3); max-width: 480px; width: 100%; background: var(--ink); color: #fff; border-radius: var(--r2); padding: var(--s3) var(--s3) var(--s3) var(--s4); }
.toast-msg { flex: 1; min-width: 0; }

#boot { margin: var(--s8) var(--s4); visibility: hidden; animation: boot 0s 3s forwards; }
@keyframes boot { to { visibility: visible; } }

/* ----- wider screens ----- */
@media (min-width: 900px) {
  .top { justify-content: flex-start; gap: var(--s2); max-width: 1040px; margin: 0 auto; padding: var(--s4) var(--s6); }
  .brand { margin-right: auto; }
  .brand { font-size: 18px; }
  #nav { position: static; border-top: 0; background: none; padding: 0; }
  .nav-list { display: flex; gap: var(--s2); padding: 0; }
  .nav-link { flex-direction: row; gap: var(--s2); min-height: 48px; padding: var(--s2) var(--s3); font-size: 16px; border-radius: var(--r1); }
  .nav-link.is-on { background: var(--lav-soft); }
  main { padding: var(--s8) var(--s6) var(--s12); }
  h1 { font-size: 32px; }
  .cols { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--s8); }
  .arealist { grid-template-columns: 1fr 1fr; gap: var(--s4); }
  .view-area .group, .view-dates .datelist.big { max-width: 640px; }
  #toast { bottom: var(--s6); }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .seg-btn, .nav-link { transition: background-color 150ms ease, color 150ms ease; }
  .bar-fill { transition: width 200ms ease; }
}

    title: 'Stay on the free Wave plan',
    what: 'Wave Starter is $0 with unlimited invoices. Card payments cost 2.9% plus $0.60 each. On Starter you enter or import bank transactions by hand. The Pro plan (CA$25 a month) connects your bank automatically. On a $2,000 card payment the fee is about $58.60, close to a 3% discount for e-Transfer ($60).',
    why: 'You already use it. This is a check that the plan still fits.',
    next: 'Stay on Starter. Look again only if entering bank transactions takes more than an hour a month. When you register for HST, add a 13% HST tax in Wave.',
    cost: '$0', time: '10 minutes',
    src: 'https://support.waveapps.com/hc/en-us/articles/15601519996436-Receipts-and-Pro-Plan-subscription-fees', srcName: 'Wave help centre, Pro plan fees' },

  { id: 'pricing', area: 'money', applies: 'now', conf: 'u', checked: C,
    title: 'Check your prices against local norms',
    what: 'Your draft package prices have not been compared with the market. The research found no reliable local price data, so nothing here says they are high or low. Your prices are not written into this app.',
    why: 'A quick check now is cheaper than repricing after your first quotes.',
    next: 'Ask your Gig Lab coach what Gig Marketplace projects usually sell for, and look at five local agency price pages.',
    cost: 'Free', time: '1 hour' },

  { id: 'terms', area: 'money', applies: 'now', conf: 'u', checked: C, pro: 'lawyer',
    title: 'Put deposit and late interest terms in writing',
    what: 'A deposit of 30% to 50% before work starts is common practice. Interest on late invoices has to be agreed in the contract, and it is safest to state it as a yearly rate. Neither point was confirmed from an official source.',
    why: 'Terms you did not write down are hard to enforce later.',
    next: 'Add both to your service agreement before the lawyer reviews it.',
    cost: 'Free', time: '20 minutes' },

  { id: 'surcharge', area: 'money', applies: 'never', conf: 'u', checked: C,
    title: 'Credit card surcharges',
    what: 'Canadian card rules allow a surcharge on credit cards, with a cap, notice and disclosure. The details were not confirmed. You already quote a card price with a discount for e-Transfer, which avoids surcharging.',
    why: 'Your discount approach is simpler.',
    next: 'Nothing to do.',
    cost: 'None', time: 'None' },

  /* ---------- Insurance ---------- */
  { id: 'home-insurer', area: 'insurance', applies: 'now', conf: 'v', checked: C, rank: 3,
    title: 'Tell your home insurer about the business',
    what: 'The Insurance Bureau of Canada says you must tell your home insurer about a business on the premises. A home policy gives only a small limit for business equipment and does not cover professional liability.',
    why: 'An undisclosed business can put a home claim at risk.',
    next: 'Call your home insurer and say you run a home office with no client visits. Ask what changes and what it costs.',
    cost: 'Possibly about $150 a year (a broker estimate)', time: '20 minutes',
    src: 'https://www.ibc.ca/insurance-basics/business/types-of-business-insurance-coverage', srcName: 'Insurance Bureau of Canada, business coverage' },

  { id: 'eo-cgl', area: 'insurance', applies: 'now', conf: 's', checked: C, rank: 6, pro: 'broker',
    title: 'Get quotes for tech E&O and general liability',
    what: 'Errors and omissions (E&O) insurance covers claims that your work cost a client money. General liability covers injury or property damage. Online brokers show combined packages from roughly $600 a year. Those are published examples, not quotes.',
    why: 'You build systems clients rely on, and home insurance does not cover this.',
    next: 'Ask two or three brokers for $1 million E&O plus $2 million general liability. After you buy, enter the renewal date on this page.',
    cost: 'About $300 to $1,200 a year', time: '1 to 2 hours',
    src: 'https://www.zensurance.com/technology-insurance', srcName: 'Zensurance, technology insurance',
    dateHint: 'Policy renewal date', dateLabel: 'Insurance policy renews' },

  { id: 'cyber', area: 'insurance', applies: 'now', conf: 's', checked: C, pro: 'broker',
    title: 'Ask for a cyber add-on in the same quotes',
    what: 'Cyber cover pays for breach response and for telling the people affected. One broker lists a small cyber limit added to a professional policy at about $100 to $200 a year.',
    why: 'You handle client data and logins.',
    next: 'Ask each broker to price a cyber add-on with the main quote.',
    cost: 'About $100 to $200 a year as an add-on', time: 'Part of the quote call',
    src: 'https://www.zensurance.com/cyber-liability-insurance', srcName: 'Zensurance, cyber liability insurance' },

  /* ---------- Grants and support ---------- */
  { id: 'venture-lab', area: 'funding', applies: 'now', conf: 'v', checked: '2026-11-16', status: 'open',
    title: 'Decide whether to apply to Venture Lab for Tech',
    what: 'A Conestoga incubator for tech-oriented business ideas. Current students, full-time or part-time, can apply. You commit an average of 15 hours a week for 15 weeks and get a dedicated industry coach plus access to Communitech resources, funding opportunities and co-working space. The next cohort runs January to April 2027. Venture Lab founders have competed at Conestoga pitch day for up to $5,000 in prize money.',
    why: 'The deadline is Friday. The catch is 15 hours a week alongside two courses, and the idea must be tech-oriented. One of your own products would fit that better than client services.',
    next: 'Ask the program team whether a productized tool from your business counts as tech-oriented, then decide by Friday.',
    cost: 'No fee listed', time: '15 hours a week for 15 weeks if accepted',
    src: 'https://research.conestogac.on.ca/conestoga-entrepreneurship-collective/programs/venture-lab-for-tech', srcName: 'Conestoga, Venture Lab for Tech',
    dates: [{ d: '2026-11-20', label: 'Venture Lab for Tech applications close' }] },

  { id: 'rbc-awards', area: 'funding', applies: 'later', conf: 's', checked: '2026-11-16', status: 'later',
    title: 'RBC Rock My Business awards ($10,000)',
    what: 'Eight $10,000 cash awards a year for people aged 18 to 39 whose business is pre-launch or a part-time side business (under 30 hours a week and under $25,000 in yearly sales). You must finish two Futurpreneur workshops first, Rock My Business Plan and Rock My Cash Flow. The 2026 deadline was 26 June 2026 and the next round has not been announced. This comes from a grant directory, not Futurpreneur\'s own page.',
    why: 'You look like a fit. The workshops are the part you can do before the next round opens.',
    next: 'Register for the two Futurpreneur workshops so you are ready when the next round opens.',
    cost: 'Free', time: 'Two workshops, then an application',
    src: 'https://grantcompass.ca/grants/rbc-rock-my-business-startup-awards', srcName: 'GrantCompass, RBC Rock My Business awards' },

  { id: 'starter-plus', area: 'funding', applies: 'now', conf: 'v', checked: C, rank: 13, status: 'ask',
    title: 'Ask about the next Starter Company Plus intake',
    what: 'An 8-week program with a chance to pitch for a grant of $2,500 to $5,000. The Waterloo Region round closed on 17 September 2026. Other centres are already running sessions for 2027. In Waterloo Region you must not be in school full-time, must run the business full-time, keep a separate bank account and put in 25% yourself. The grant is taxable.',
    why: 'You might qualify. Two courses in Winter 2027 could be a problem, so ask first.',
    next: 'Email the Small Business Centre: when is the 2027 intake, and are two part-time courses allowed?',
    cost: '25% of the grant from you ($1,250 on $5,000)', time: '15 minutes to ask',
    src: 'https://www.waterlooregionsmallbusiness.com/growing/programs-gyb/starter-company-plus/', srcName: 'Starter Company Plus, Waterloo Region',
    dateHint: 'Next intake closing date, once you know it', dateLabel: 'Starter Company Plus intake closes' },

  { id: 'sbc-advisor', area: 'funding', applies: 'now', conf: 'u', checked: C, status: 'open',
    title: 'Book a Small Business Centre advisor appointment',
    what: 'The Waterloo Region Small Business Centre offers advisor appointments and workshops. Whether appointments are free was not re-checked.',
    why: 'One conversation can answer several of the open questions in this list, including Starter Company Plus.',
    next: 'Book an appointment on their site and bring your open questions.',
    cost: 'Not confirmed', time: '1 hour',
    src: 'https://www.waterlooregionsmallbusiness.com', srcName: 'Waterloo Region Small Business Centre' },

  { id: 'eset', area: 'funding', applies: 'later', conf: 'v', checked: '2026-11-16', status: 'ask',
    title: 'Conestoga Entrepreneurship and Self-employment Training',
    what: 'A free 16-week Employment Ontario program at Conestoga with one-to-one support, workshops, weekly mentoring and networking. It covers market validation, pricing, sales, LinkedIn networking, and legal and financial topics. The page lists no eligibility rules or start dates. It is support, not money.',
    why: 'Useful, but 16 weeks is a lot next to school and the Gig Lab. Better after the Gig Lab ends.',
    next: 'Fill in the information form on the page or call 519-748-5220 to ask about eligibility and the next start date.',
    cost: 'Free', time: '16 weeks',
    src: 'https://conestogac.on.ca/subsidized-training/employment/entrepreneurship-and-self-employment-training', srcName: 'Conestoga, Entrepreneurship and Self-employment Training' },

  { id: 'futurpreneur', area: 'funding', applies: 'later', conf: 'v', checked: '2026-11-16', status: 'open',
    title: 'Futurpreneur Side Hustle loan and mentoring',
    what: 'A five-year loan of up to $25,000 with two years of mentoring, for people aged 18 to 39 who run a business while keeping other commitments. You must be a Canadian citizen or permanent resident. It is debt. Futurpreneur also has a larger start-up loan for full-time founders.',
    why: 'Fits a part-time business better than the full start-up loan. Use it only if you have a clear need for the money.',
    next: 'Come back to this if a real funding need shows up.',
    cost: 'Loan interest', time: 'An application with a business plan and cash flow',
    src: 'https://futurpreneur.ca/offering/side-hustle/', srcName: 'Futurpreneur, Side Hustle' },

  { id: 'csbfp', area: 'funding', applies: 'later', conf: 's', checked: '2026-11-16', status: 'open',
    title: 'Canada Small Business Financing Program loan',
    what: 'A federal program that backs loans made by banks and credit unions, so they are more willing to lend. Sole proprietors and start-ups can apply through their own bank. It suits equipment more than day-to-day costs.',
    why: 'Only if you ever need equipment financing.',
    next: 'Nothing now. Ask your bank about it if a large equipment purchase comes up.',
    cost: 'Loan interest and fees', time: 'Through your bank',
    src: 'https://ised-isde.canada.ca/site/canada-small-business-financing-program/en/small-businesses/frequently-asked-questions-small-businesses', srcName: 'Canada Small Business Financing Program, questions for businesses' },

  { id: 'access-microloan', area: 'funding', applies: 'later', conf: 's', checked: '2026-11-16', status: 'ask',
    title: 'ACCESS Community Capital Fund microloans',
    what: 'Microloans of up to $15,000 in Ontario for people who cannot get regular bank financing. This comes from a secondary list and was not checked on the fund\'s own site.',
    why: 'A fallback if a bank says no and you have a real need.',
    next: 'Nothing now.',
    cost: 'Loan interest', time: 'Not known',
    src: 'https://welcomeaide.com/ru/blog/business-grants-funding-programs-newcomers-canada-2026', srcName: 'WelcomeAide funding list (secondary)' },

  { id: 'bdc', area: 'funding', applies: 'later', conf: 's', checked: C, status: 'open',
    title: 'BDC start-up financing',
    what: 'Secondary sources say BDC usually wants about 12 months of revenue before it lends.',
    why: 'Too early.',
    next: 'Look again after your first full year of sales.',
    cost: 'Loan interest', time: 'Not known' },

  { id: 'skip-programs', area: 'funding', applies: 'never', conf: 'v', checked: '2026-11-16', status: 'closed',
    title: 'Programs you can skip',
    what: 'Early Sparks is only for people who do not already own a registered business, and you registered in November. The Canada Digital Adoption Program ended on 31 March 2025. The Digital Main Street $2,500 grant is closed (from secondary sources). Summer Company is for students aged 15 to 29. "Builder Plus" did not turn up as a program anywhere.',
    why: 'They are closed, or you do not meet a rule.',
    next: 'Nothing to do.',
    cost: 'None', time: 'None' },

  { id: 'unchecked-programs', area: 'funding', applies: 'later', conf: 'u', checked: '2026-11-16', status: 'ask',
    title: 'Programs not checked yet',
    what: 'Not checked so far: Communitech programs outside Venture Lab, the Accelerator Centre, LiftOff, Innovation Guelph, IRAP, city grants, and programs for newcomer or racialized entrepreneurs.',
    why: 'Some may fit. Communitech and the Accelerator Centre mainly serve product startups.',
    next: 'Ask Claude to check these a few at a time, or ask the Small Business Centre advisor.',
    cost: 'Free', time: '30 minutes' },

  /* ---------- Networking ---------- */
  { id: 'chamber', area: 'networking', applies: 'now', conf: 'v', checked: C,
    title: 'Ask the Chamber about the solo rate and a sponsored first year',
    what: 'The Greater KW Chamber runs 80 or more events a year and has about 1,600 to 1,800 members, mostly owners and managers. A BIA program offers a fully sponsored first-year membership to people in Uptown Waterloo BIA and Downtown Kitchener BIA programs. The sole proprietor fee was not confirmed.',
    why: 'This is where your target clients are.',
    next: 'Call the Chamber for the sole proprietor rate, and ask both BIAs whether you can qualify for the sponsored year.',
    cost: 'Fee not confirmed', time: '30 minutes',
    src: 'https://greaterkwchamber.com/bia-application/', srcName: 'Greater KW Chamber, BIA membership program' },

  { id: 'builders-club', area: 'networking', applies: 'now', conf: 'v', checked: C,
    title: 'Try one Builders Club event',
    what: 'A clubhouse and community at 165 King St W, Kitchener. Regular events include alternating technical and non-technical Wednesdays, Revenue Tuesdays every two weeks and a monthly Claude Waterloo meetup. Most people there are founders, developers and students, so expect referrals and subcontract work more than direct clients. A Remote Worker Holiday Party is also on 27 November 2026.',
    why: 'It was recommended to you, and many events are free.',
    next: 'Pick one event from their calendar and go.',
    cost: 'Many events are free. Membership cost not confirmed', time: '2 to 3 hours',
    src: 'https://buildersclub.ca/events', srcName: 'Builders Club events',
    dates: [{ d: '2026-11-25', label: 'Builders Club Mentoring Speakeasy, 5:30 to 8 pm (optional)' }] },

  { id: 'rooms', area: 'networking', applies: 'now', conf: 'p', checked: C, rank: 12,
    title: 'Commit to one owner room and one peer room',
    what: 'Going to the same event every two weeks builds more trust than many one-off events. Arrive with one sentence about what you do and one offer: a free website check.',
    why: 'Your time is limited, so repeat visits beat variety.',
    next: 'Choose one Chamber event and one Builders Club session and put both in your calendar as repeating.',
    cost: 'Chamber fee not confirmed', time: '2 to 3 hours every two weeks' },

  { id: 'follow-up', area: 'networking', applies: 'now', conf: 'p', checked: C,
    title: 'Follow up within 48 hours and log each contact',
    what: 'After each event, send a short personal note with your website-check link, and keep track of who you met and what comes next. The 48 hours is a habit, not a researched finding.',
    why: 'A contact you do not follow up is a contact you lose.',
    next: 'Add each person to Leads with a follow-up date two days out, then copy the event follow-up message.',
    tool: 'leads',
    cost: 'Free', time: '20 minutes to set up, 15 minutes after each event' },

  { id: 'other-groups', area: 'networking', applies: 'later', conf: 'u', checked: C,
    title: 'Other groups to check',
    what: 'Not checked in the research: Communitech events, Small Business Centre events, BNI chapters, the Cambridge Chamber, Conestoga and University of Waterloo alumni networks, and the two BIAs.',
    why: 'Start with the two rooms you already know about.',
    next: 'Ask Claude to check cost, schedule and who attends for two of these at a time.',
    cost: 'Not known', time: '30 minutes' },

  /* ---------- Marketing and online presence ---------- */
  { id: 'gbp', area: 'marketing', applies: 'now', conf: 'v', checked: T, rank: 10,
    title: 'Set up a Google Business Profile',
    what: 'A free listing that puts you in Google Search and Maps. Google says a business with no storefront where it receives customers must hide its address, and the profile then shows a service area.',
    why: 'Local owners search before they call.',
    next: 'Create the profile, hide your home address and set the service area to Kitchener, Waterloo and Cambridge. Then verify it the way Google asks.',
    cost: 'Free', time: '1 hour',
    src: 'https://support.google.com/business/answer/10514137', srcName: 'Google Business Profile help, service areas' },

  { id: 'domain', area: 'marketing', applies: 'now', conf: 'u', checked: C, rank: 11,
    title: 'Buy a .ca domain and point your site at it',
    what: 'A domain of your own looks more established than a github.io address and lets you set up a branded email later. A .ca domain needs Canadian presence, which a resident has. GitHub Pages supports custom domains. The price was not confirmed.',
    why: 'It is cheap and every other marketing step links to it.',
    next: 'Pick the name, buy it from a registrar and add it in your GitHub Pages settings. Then enter the renewal date on this page.',
    cost: 'About $15 to $25 a year (not confirmed)', time: '1 hour',
    src: 'https://www.cira.ca', srcName: 'CIRA (not opened in the research)',
    dateHint: 'Domain renewal date', dateLabel: 'Domain renews' },

  { id: 'search-console', area: 'marketing', applies: 'now', conf: 'u', checked: C,
    title: 'Add your site to Google Search Console',
    what: 'A free Google tool that shows which searches find your site and flags problems. You prove you own the site with a DNS record or a small file.',
    why: 'It tells you whether the site is being found at all.',
    next: 'Add the site after the domain is set up, so you only verify once.',
    cost: 'Free', time: '30 minutes',
    src: 'https://search.google.com/search-console', srcName: 'Google Search Console' },

  { id: 'linkedin', area: 'marketing', applies: 'now', conf: 'p', checked: C,
    title: 'Point your LinkedIn profile at local owners',
    what: 'For a solo business selling to other businesses, your personal profile does most of the work. A company page is optional early on. LinkedIn does not allow automation tools or bots.',
    why: 'It is the profile people check after meeting you.',
    next: 'Rewrite your headline to say who you help and how, and add the website-check link.',
    cost: 'Free', time: '1 hour' },

  { id: 'posting', area: 'marketing', applies: 'now', conf: 'p', checked: C,
    title: 'Post one useful thing a week and reuse it',
    what: 'One LinkedIn post a week is enough, for example a before and after from a website check. Reuse the same piece as a Google Business Profile update, a short case study on your site and an email to warm contacts.',
    why: 'One piece used four ways fits the hours you have.',
    next: 'Write your first post from one real website check.',
    cost: 'Free', time: '1 hour a week' },

  { id: 'proof', area: 'marketing', applies: 'now', conf: 'p', checked: C,
    title: 'Turn finished work into proof',
    what: 'After each project, ask for a Google review and a two-line testimonial. Write up each demo or unpaid project as a short case study: the problem, what you built, the result.',
    why: 'The Gig Marketplace profile needs two case studies.',
    next: 'Write two case studies from work you have already done.',
    cost: 'Free', time: '2 hours' },

  { id: 'directories', area: 'marketing', applies: 'later', conf: 'u', checked: C,
    title: 'List in a few directories',
    what: 'Possible listings: Bing Places, Apple Business Connect, Clutch and Explore Waterloo Region. None were checked. The Chamber directory is for members only.',
    why: 'Worth less than the Google profile, so it comes after.',
    next: 'Do this after the Google Business Profile is live, and reuse the same wording.',
    cost: 'Mostly free (not confirmed)', time: '1 hour' },

  /* ---------- Finding clients ---------- */
  { id: 'gig-marketplace', area: 'clients', applies: 'now', conf: 'v', checked: C, rank: 9,
    title: 'Finish the Gig Lab and launch your Gig Marketplace profile',
    what: 'Only Gig Lab graduates can list on the Conestoga Gig Marketplace. Businesses post work on the Gig Board or browse the freelancer directory. Conestoga says it has delivered more than $1 million in services across 150 or more projects. Conestoga also gives some skilled trades founders $1,000 to spend there.',
    why: 'It is your best warm source of paid work, and it opens when the program ends.',
    next: 'Get your profile, packages and two case studies ready before the last session.',
    cost: 'Free', time: '4 hours',
    src: 'https://www.conestogagigs.ca/', srcName: 'Conestoga Gig Marketplace',
    dateHint: 'Your last Gig Lab session', dateLabel: 'Last Gig Lab session' },

  { id: 'gig-terms', area: 'clients', applies: 'now', conf: 'u', checked: C,
    title: 'Ask about Gig Marketplace fees, terms and insurance',
    what: 'Fees, commission and terms were not confirmed. Neither was whether the marketplace or its clients ask for proof of insurance.',
    why: 'The answers change your prices and your insurance quotes.',
    next: 'Ask the Gig Marketplace coordinator all three questions in one email.',
    cost: 'Free', time: '10 minutes' },

  { id: 'website-check-outreach', area: 'clients', applies: 'now', conf: 'p', checked: C,
    title: 'Send personal website-check emails',
    what: 'Your free website check is a good opener because it is about the owner\'s own business. Write each email by hand to one person. No bulk lists.',
    why: 'This is the outreach you said you need most.',
    next: 'Send five a week with the website check email in Messages, and add each business to Leads.',
    tool: 'messages',
    cost: 'Free', time: '1 to 2 hours a week' },

  { id: 'pipeline', area: 'clients', applies: 'now', conf: 'p', checked: C,
    title: 'Track every lead through simple stages',
    what: 'Stages: lead, contacted, conversation booked, website check sent, proposal sent, deposit paid, delivered, paid in full, review asked. For each lead keep the date and the next action.',
    why: 'You stop losing track of who is waiting on you.',
    next: 'Use Leads for this. Each lead has a stage and a follow-up date.',
    tool: 'leads',
    cost: 'Free', time: '20 minutes' },

  { id: 'referrals', area: 'clients', applies: 'later', conf: 'u', checked: C,
    title: 'Ask each happy client for one introduction',
    what: 'A referral fee of about 10% is a common informal habit, not a confirmed norm. If you pay one, say so.',
    why: 'It starts after your first paid project.',
    next: 'Add the ask to your handover checklist. The referral message is in Messages.',
    tool: 'messages',
    cost: 'Free', time: '5 minutes per client' },

  { id: 'other-channels', area: 'clients', applies: 'later', conf: 'p', checked: C,
    title: 'Other local channels',
    what: 'Chamber member-to-member contacts, the BIAs, Small Business Centre referrals, and subcontracting for local agencies or Builders Club founders.',
    why: 'Add one only when your main outreach routine is steady.',
    next: 'Pick one and try it for a month.',
    cost: 'Free', time: 'Varies' },

  /* ---------- Delivering work ---------- */
  { id: 'scope', area: 'delivery', applies: 'now', conf: 'p', checked: C,
    title: 'Use acceptance criteria and a change rule in every proposal',
    what: 'List what you will deliver, how each piece will be judged done, and what is not included. Anything outside that is a change request, priced and agreed in writing. Two revision rounds and a deposit before work starts are common practice.',
    why: 'Fixed prices only work when the scope is fixed.',
    next: 'Check your proposal template has all four parts.',
    cost: 'Free', time: '30 minutes' },

  { id: 'pipeda', area: 'delivery', applies: 'now', conf: 'v', checked: T,
    title: 'Know your privacy duties under PIPEDA',
    what: 'PIPEDA covers personal information handled in business. The Privacy Commissioner says large and small businesses must report a breach that poses a real risk of significant harm, tell the people affected, and keep a record of every breach. When you handle a client\'s customer data, your contract should say how you protect it. The state of federal privacy law reform was not checked.',
    why: 'You will touch client data on most jobs.',
    next: 'Read the Privacy Commissioner\'s breach page and add a data handling section to your agreement.',
    cost: 'Free', time: '1 hour',
    src: 'https://www.priv.gc.ca/en/privacy-topics/business-privacy/breaches-and-safeguards/privacy-breaches/respond-to-a-privacy-breach-at-your-business/gd_pb_201810/', srcName: 'Privacy Commissioner, mandatory breach reporting' },

  { id: 'ai-clause', area: 'delivery', applies: 'now', conf: 'p', checked: C,
    title: 'Add an AI use and data clause',
    what: 'Say in the contract that AI tools help with the work, that you review everything, and that no client personal data or secrets go into AI tools without permission.',
    why: 'Clients should hear it from you before the work starts.',
    next: 'Add the clause to your service agreement.',
    cost: 'Free', time: '20 minutes' },

  { id: 'accessibility', area: 'delivery', applies: 'now', conf: 'v', checked: T,
    title: 'Build to accessibility standards anyway',
    what: 'Ontario law requires public websites to meet WCAG 2.0 Level AA for public sector bodies and for businesses with 50 or more employees. Your clients are smaller, so most are not legally covered. Building to the standard is still a selling point.',
    why: 'It costs little when you do it from the start.',
    next: 'Add an accessibility check to your delivery checklist.',
    cost: 'Free', time: '30 minutes',
    src: 'https://www.ontario.ca/page/how-make-websites-accessible', srcName: 'Ontario, how to make websites accessible' },

  { id: 'handover', area: 'delivery', applies: 'now', conf: 'p', checked: C,
    title: 'Make a handover kit template',
    what: 'At the end of a job the client gets every login in accounts they own, the domain and hosting in their name, the source code, a short admin guide, a backup, and a list of third-party services with renewal dates.',
    why: 'A clean handover is what gets you the review and the referral.',
    next: 'Write the template once and reuse it.',
    cost: 'Free', time: '1 hour' },

  { id: 'warranty', area: 'delivery', applies: 'now', conf: 'u', checked: C,
    title: 'Offer a 30-day bug-fix warranty in writing',
    what: 'A common habit is 30 days of fixes for defects against the agreed scope. New features and changes made by third parties are not included. This is not a confirmed norm.',
    why: 'It sets a clear end to free support.',
    next: 'Add the wording to your service agreement.',
    cost: 'Free', time: '15 minutes' },

  { id: 'retainer', area: 'delivery', applies: 'later', conf: 'p', checked: C,
    title: 'Offer a monthly maintenance plan',
    what: 'A monthly maintenance or hosting plan makes sense once you have three or more live sites.',
    why: 'There is nothing to maintain yet.',
    next: 'Come back to this after your third delivered project.',

    if (r === 'lead') return { name: 'lead', arg: p[1], tab: 'leads', depth: 2 };
    if (r === 'messages') return { name: 'messages', tab: 'leads', depth: 2 };
    if (['week', 'leads', 'areas', 'dates', 'wins', 'settings'].indexOf(r) < 0) r = 'week';
    return { name: r, tab: r, depth: 1 };
  }

  function drawNav(tab) {
    navEl.textContent = '';
    var ul = h('ul', { class: 'nav-list' });
    NAV.forEach(function (n) {
      var link = h('a', {
        href: '#/' + n.route, class: 'nav-link' + (tab === n.route ? ' is-on' : ''), 'aria-current': tab === n.route ? 'page' : null
      }, icon(n.icon), h('span', { text: n.label }));
      if (n.route === 'settings') {
        /* Settings sits in the header on phones so the bottom bar keeps four roomy tabs. */
        link.className += ' nav-settings';
        setEl.textContent = '';
        setEl.appendChild(link);
      } else {
        ul.appendChild(h('li', null, link));
      }
    });
    navEl.appendChild(ul);
  }

  function render(keep) {
    var r = parse();
    var hash = location.hash || '#/week';
    var sameRoute = hash === lastHash;
    var y = window.scrollY;
    var focusKey = lastKey || (sameRoute && document.activeElement && document.activeElement.getAttribute ? document.activeElement.getAttribute('data-k') : null);
    lastKey = null;
    var view = r.name === 'week' ? viewWeek() : r.name === 'areas' ? viewAreas() : r.name === 'area' ? viewArea(r.arg) :
      r.name === 'item' ? viewItem(r.arg) : r.name === 'dates' ? viewDates() : r.name === 'wins' ? viewWins() :
      r.name === 'leads' ? viewLeads() : r.name === 'lead' ? viewLead(r.arg) : r.name === 'messages' ? viewMessages() : viewSettings();
    main.textContent = '';
    add(main, view);
    main.className = 'view-' + r.name;
    drawNav(r.tab);
    document.title = (main.querySelector('h1') ? main.querySelector('h1').textContent + ' \u00b7 ' : '') + 'Phoenix Steps';
    if (sameRoute || keep) {
      window.scrollTo(0, y);
      if (focusKey) {
        var fk = focusKey.replace(/[^a-z0-9-]/gi, '');
        var el = main.querySelector('[data-k="' + fk + '"]');
        /* The Mark done and Mark not done buttons replace each other, so follow the swap. */
        if (!el && fk.indexOf('done-') === 0) el = main.querySelector('[data-k="undo-' + fk.slice(5) + '"]');
        if (!el && fk.indexOf('undo-') === 0) el = main.querySelector('[data-k="done-' + fk.slice(5) + '"]');
        if (el) el.focus({ preventScroll: true });
      }
    } else {
      var back = r.depth < lastDepth && scrolls[hash] != null;
      window.scrollTo(0, back ? scrolls[hash] : 0);
      var h1 = main.querySelector('h1');
      if (h1 && lastHash !== null) h1.focus({ preventScroll: true });
    }
    lastHash = hash; lastDepth = r.depth;
  }
  function renderKeep() { render(true); }

  window.addEventListener('scroll', function () { if (lastHash) scrolls[lastHash] = window.scrollY; }, { passive: true });
  window.addEventListener('hashchange', function () { pendingRestore = null; restoreError = ''; render(false); });
  document.getElementById('skip').addEventListener('click', function () { var t = main.querySelector('h1'); if (t) t.focus(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { var r = parse(); if (r.name === 'week' || r.name === 'dates') renderKeep(); } });

  var boot = document.getElementById('boot');
  if (boot) boot.remove();
  render(false);
})();
</script>
</body>
</html>
